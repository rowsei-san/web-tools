<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tools Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0e0f12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #e3e3e3;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #8e9196;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #181a1f;
      border: 1px solid #2d3037;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #a8c7fa;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #a8c7fa;
    }
    .card p {
      font-size: 13px;
      color: #c4c7c5;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: block;
      text-align: center;
      background: #2d3037;
      color: #e3e3e3;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .btn.primary {
      background: #a8c7fa;
      color: #040e15;
    }
    .btn:hover {
      background: #3c4043;
    }
    .btn.primary:hover {
      background: #c2e7ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛠️ Web Tools Hub</h1>
    <p>ブラウザでそのまま使える自作ツール集</p>
  </div>

  <div class="grid">
    <div class="card">
      <div>
        <h2>🎬 Chat AI Video Generator</h2>
        <p>チャットAI風の対話アニメーション画面をリアルタイム生成し、動画（MP4/WebM）としてキャプチャ保存できるツールです。</p>
      </div>
      <div class="button-group">
        <a href="./chatAI_generator/chatAI_image_gen.html" class="btn primary">起動する (メイン版)</a>
        <a href="./chatAI_generator/generator.html" class="btn">起動する (サブ版)</a>
      </div>
    </div>
  </div>
</body>
</html>
