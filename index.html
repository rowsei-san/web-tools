<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tools Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0e0f12;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #e3e3e3;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: #8e9196;
      margin-bottom: 16px;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #a8c7fa;
      text-decoration: none;
      background: #181a1f;
      border: 1px solid #2d3037;
      padding: 6px 16px;
      border-radius: 20px;
      transition: all 0.2s;
    }
    .github-link:hover {
      background: #2d3037;
      border-color: #a8c7fa;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #181a1f;
      border: 1px solid #2d3037;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #a8c7fa;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #a8c7fa;
    }
    .card p {
      font-size: 13px;
      color: #c4c7c5;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      display: block;
      text-align: center;
      background: #2d3037;
      color: #e3e3e3;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }
    .btn.primary {
      background: #a8c7fa;
      color: #040e15;
    }
    .btn.primary:hover {
      background: #c2e7ff;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛠️ Web Tools Hub</h1>
    <p>ブラウザでそのまま使える自作ツール集</p>
    <a href="https://github.com/rowsei-san/web-tools#readme" target="_blank" rel="noopener noreferrer" class="github-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
      README / GitHub を見る
    </a>
  </div>

  <div class="grid">
    <div class="card">
      <div>
        <h2>🎬 Chat AI Video Generator</h2>
        <p>チャットAI風の対話アニメーション画面をリアルタイム生成し、動画（MP4/WebM）としてキャプチャ保存できるツールです。</p>
      </div>
      <div class="button-group">
        <a href="./chatAI_generator/chatAI_image_gen.html" class="btn primary">ツールを起動する</a>
      </div>
    </div>
  </div>
</body>
</html>
