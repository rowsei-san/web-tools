<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>疑似チャットAI Q&A動画イメージジェネレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>🎬 疑似チャットAI Q&A動画イメージジェネレーター</h1>
  </div>

  <div class="container">
    <!-- プレビューエリア -->
    <div class="preview-container">
      <canvas id="mainCanvas" width="1920" height="1080"></canvas>
      
      <!-- プレビュー直下の操作ボタン＆ステータス -->
      <div class="preview-controls">
        <div class="button-group">
          <button id="playBtn" class="btn btn-secondary">▶ アニメーション再生</button>
          <button id="recordBtn" class="btn">💾 動画をキャプチャ＆保存</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="panel">
      <div class="form-group full-width">
        <label for="promptText">1. ユーザー質問プロンプト</label>
        <textarea id="promptText">eseCLIを使って、ローカルファイルの更新タスクを即座に実行してください。ブラウザAIの能力を最大限に引き出します。</textarea>
      </div>

      <div class="form-group full-width">
        <label for="answerText">2. AI回答テキスト</label>
        <textarea id="answerText" style="height: 80px;">eseCLIはブラウザAIとローカル環境をダイレクトに接続し、コピペなしで一撃でファイルの作成や修正を完了させます。高いセキュリティを保ちながら完全自動化を実現します。</textarea>
      </div>

      <div class="form-group">
        <label for="aspectSelect">動画画角 (アスペクト比)</label>
        <select id="aspectSelect">
          <option value="16:9" selected>横型 16:9 (YouTube / PC)</option>
          <option value="9:16">縦型 9:16 (Shorts / TikTok / Reels)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="themeSelect">AI UIテーマ</label>
        <select id="themeSelect">
          <option value="copilot">Copilot (Warm Light)</option>
          <option value="gemini">Gemini (Dark)</option>
          <option value="chatgpt">ChatGPT (Light)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="typingSpeed">質問入力スピード (ms/字)</label>
        <input type="number" id="typingSpeed" value="40" min="10" max="300">
      </div>

      <div class="form-group">
        <label for="humanJitter">ヒト揺らぎ <span id="jitterLevelLabel">Lv. 2</span></label>
        <input type="range" id="humanJitter" min="1" max="4" step="1" value="2">
      </div>

      <div class="form-group">
        <label for="thinkTime">思考時間 (秒)</label>
        <input type="number" id="thinkTime" value="2.0" step="0.5" min="0.5" max="5">
      </div>

      <div class="form-group">
        <label for="answerSpeed">回答出力スピード (ms/字)</label>
        <input type="number" id="answerSpeed" value="20" min="5" max="100">
      </div>

      <div class="form-group">
        <label for="endDelay">送信後演出・余白時間 (秒)</label>
        <input type="number" id="endDelay" value="2.5" step="0.5" min="0">
      </div>

      <div class="form-group">
        <label for="formatSelect">保存形式</label>
        <select id="formatSelect">
          <option value="auto" selected>自動選択 (推奨)</option>
          <option value="mp4">MP4 (環境依存)</option>
          <option value="webm">WebM (高安定)</option>
        </select>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
