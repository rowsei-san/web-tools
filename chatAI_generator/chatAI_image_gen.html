<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>疑似チャットAI Q&A動画イメージジェネレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header">
    <h1>🎬 疑似チャットAI Q&A動画イメージジェネレーター</h1>
  </div>

  <div class="container">
    <!-- プレビューエリア -->
    <div class="preview-container">
      <canvas id="mainCanvas" width="1920" height="1080"></canvas>
      
      <!-- プレビュー直下の操作ボタン＆ステータス -->
      <div class="preview-controls">
        <div class="button-group">
          <button id="playBtn" class="btn btn-secondary">▶ PREVIEW</button>
          <button id="recordBtn" class="btn">💾 動画をキャプチャ＆保存/RECORD</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="panel">
      <div class="form-group full-width">
        <label for="promptText">1. ユーザー質問プロンプト/prompt</label>
        <textarea id="promptText">この動画ジェネレーターは一体、なんの役に立つのでしょうか？</textarea>
      </div>

      <div class="form-group full-width">
        <label for="answerText">2. AI回答テキスト/answer</label>
        <textarea id="answerText" style="height: 110px;">画面録画ソフトを立ち上げて実際にタイピングする手間を省き、「あたかもAIが回答しているっぽいアニメーション」を数秒で捏造することができます。

捏造できるからといってあまりにひどい回答案は、あなた自身が恥ずかしい思いをするかもしれませんので、くれぐれもご注意ください。

また、すてきな有効活用法があればぜひ教えていただきたいものです。</textarea>
      </div>

      <div class="form-group">
        <label for="aspectSelect">アスペクト比/aspect</label>
        <select id="aspectSelect">
          <option value="16:9" selected>横型 16:9</option>
          <option value="9:16">縦型 9:16</option>
        </select>
      </div>

      <div class="form-group">
        <label for="themeSelect">AI UIテーマ</label>
        <select id="themeSelect">
          <option value="copilot">Copilot風 (Warm Light)</option>
          <option value="gemini">Gemini風 (Dark)</option>
          <option value="chatgpt">ChatGPT分 (Light)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="typingSpeed">質問入力スピード (ms/字)/speed</label>
        <input type="number" id="typingSpeed" value="40" min="10" max="300">
      </div>

      <div class="form-group">
        <label for="humanJitter">ヒト揺らぎ/jitter <span id="jitterLevelLabel">Lv. 2</span></label>
        <input type="range" id="humanJitter" min="1" max="4" step="1" value="2">
      </div>

      <div class="form-group">
        <label for="thinkTime">思考時間 (秒)/thinktime</label>
        <input type="number" id="thinkTime" value="2.0" step="0.5" min="0.5" max="5">
      </div>

      <div class="form-group">
        <label for="answerSpeed">回答出力スピード (ms/字)</label>
        <input type="number" id="answerSpeed" value="20" min="5" max="100">
      </div>

      <div class="form-group">
        <label for="endDelay">送信後演出・余白時間 (秒)/delay</label>
        <input type="number" id="endDelay" value="2.5" step="0.5" min="0">
      </div>

      <div class="form-group">
        <label for="formatSelect">保存形式/format</label>
        <select id="formatSelect">
          <option value="auto" selected>自動選択 (推奨)</option>
          <option value="mp4">MP4 (環境依存)</option>
          <option value="webm">WebM (高安定)</option>
        </select>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
